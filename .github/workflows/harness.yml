name: Harness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate context
        run: python3 harness/checks/check.py context
      - name: Test harness
        run: python3 -m unittest discover -s harness/tests -v
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify secret scanner
        run: python3 harness/checks/verify_gitleaks.py "$RUNNER_TEMP/gitleaks"
      - name: Scan working tree for secrets
        run: '"$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 .'
      - name: Scan available Git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --log-opts="--all" .'
