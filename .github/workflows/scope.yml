name: Task scope verification
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Full SHA of an approved ancestor commit containing the policy
        required: true
        type: string
      policy_path:
        description: Repository-relative path to approved policy in that commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check task scope against approved baseline policy
        env:
          TASK_BASELINE: ${{ inputs.baseline }}
          TASK_POLICY: ${{ inputs.policy_path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK_BASELINE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TASK_BASELINE" HEAD
          python3 harness/checks/check.py scope --base "$TASK_BASELINE" --policy-from-base "$TASK_POLICY"
